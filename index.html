		<!--
			The Telegram Mini App SDK is NOT loaded here. It used to be, which gave telegram.org
			script execution in this page's context for every visitor on every load, whether or not

			when the launch actually is a Mini App session.
		-->

		<!-- This script is required for some web3 libraries -->
		<script>
			if (global === undefined) {
				var global = window;
			}
		</script>
